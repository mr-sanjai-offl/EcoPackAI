version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecopack-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecopack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
      POSTGRES_DB: ${POSTGRES_DB:-ecopack_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecopack_user} -d ${POSTGRES_DB:-ecopack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ecopack-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-securepassword123}
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecopack-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ecopack_user}:${POSTGRES_PASSWORD:-securepassword123}@db:5432/${POSTGRES_DB:-ecopack_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-securepassword123}@redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
    networks:
      - backend_network
      - frontend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecopack-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  proxy:
    image: nginx:alpine
    container_name: ecopack-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend_network

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
    internal: true # Isolates DB and Redis from outside access

volumes:
  postgres_data:
  redis_data:
